spring:
  config:
    activate:
      on-profile:
        - dev

  datasource:
    url: jdbc:postgresql://localhost:5432/kiwi
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false